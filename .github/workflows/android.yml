name: Android

# Push a tag like android-v0.1.0 to build the signed APK and attach it to a GitHub release.
# Run it by hand ("Run workflow") to just build an APK and download it as an artifact.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release named android-v<versionName> (creates the tag). Leave off to just build the APK.'
        type: boolean
        default: false
      force:
        description: 'Publish even though the CI workflow has not succeeded for this commit (emergency override, see docs/DISTRIBUTION.md).'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # the release gate reads the CI runs of this commit

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      # A release is published only for a commit whose CI run (typecheck, tests, build, UI checks) is green. This workflow
      # runs on its own, so without this gate a tag or "Run workflow" could ship a commit CI had rejected (0.24.1 did).
      # `force` is the documented override; a tag push cannot set it (re-run by hand with force to override).
      - name: Release gate (CI must be green for this commit)
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::warning::force=true: publishing ${GITHUB_SHA} without a successful CI run"
            exit 0
          fi
          latest=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${GITHUB_SHA}" --limit 20 --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
          if [ -z "$latest" ]; then
            echo "::error::No CI run found for commit ${GITHUB_SHA}. Push it to main (or open a PR) and wait for CI, or re-run with force=true."
            exit 1
          fi
          if [ "$latest" != "completed success" ]; then
            echo "::error::The latest CI run for commit ${GITHUB_SHA} is '${latest}', not 'completed success'. Fix or wait for CI, or re-run with force=true."
            exit 1
          fi
          echo "CI is green for ${GITHUB_SHA}"

      # The in-app updater only installs an update signed with the same key as the installed app. A debug-signed APK
      # (what the build falls back to without the secrets) would be refused by every later update, so never publish one.
      - name: Refuse to publish without the signing key
        if: ${{ (github.ref_type == 'tag' || inputs.publish) && env.HAS_KEY != 'true' }}
        shell: bash
        run: |
          echo "::error::The ANDROID_KEYSTORE_BASE64 secret (and its password / alias secrets) is missing, so the APK would be debug-signed and the in-app updater would refuse every later update. Add the secrets (docs/DISTRIBUTION.md) and run again."
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the web UI for Android
        run: npm run build:android-ui

      - name: Read the version
        id: v
        shell: bash
        run: |
          v=$(grep '^versionName=' android/app/version.properties | cut -d= -f2)
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "android-v$v" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName $v in android/app/version.properties" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Decode the signing key (only when the secrets exist)
        if: env.HAS_KEY == 'true'
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lyra-release.jks"
          echo "LYRA_KEYSTORE=$RUNNER_TEMP/lyra-release.jks" >> "$GITHUB_ENV"
          echo "LYRA_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "LYRA_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "LYRA_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # the Kotlin unit tests (updater, TV / Connect client, Car, AOD, audio) had never run in CI
      - name: Android unit tests and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon --console=plain

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Name the APK
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk "Lyra-Android-${{ steps.v.outputs.version }}.apk"

      # the in-app updater verifies the download against this file before it installs anything
      - name: Checksum the APK
        shell: bash
        run: sha256sum "Lyra-Android-${{ steps.v.outputs.version }}.apk" > "Lyra-Android-${{ steps.v.outputs.version }}.apk.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: Lyra-Android-${{ steps.v.outputs.version }}
          path: |
            Lyra-Android-*.apk
            Lyra-Android-*.apk.sha256

      - name: Publish release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Lyra-Android-${{ steps.v.outputs.version }}.apk"
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="android-v${{ steps.v.outputs.version }}"; fi
          # judge the VERSION, not the tag: "android-v0.4.0" contains a dash but is a normal release; "0.4.0-beta.1" is not
          PRE=""
          case "${{ steps.v.outputs.version }}" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber   # tag was moved: replace the APK
            [ -z "$PRE" ] && gh release edit "$TAG" --prerelease=false --latest=false || true
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "${{ github.sha }}" \
              --title "Lyra for Android ${{ steps.v.outputs.version }}" \
              --generate-notes $PRE \
              --latest=false   # keep the Windows release as "latest": the desktop updater reads it
          fi
